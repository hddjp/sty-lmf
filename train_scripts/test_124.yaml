### model
model_name_or_path: Qwen/Qwen3-0.6B #Qwen/Qwen3-4B-Instruct-2507
trust_remote_code: true
flash_attn: fa2

### method
stage: distill
do_train: true
finetuning_type: full


### dataset
dataset: gsm8kall #,MATHall
template: qwen3_nothink
cutoff_len: 40000
max_samples: 32
disable_shuffling: true 

### output
output_dir: saves/qwen3-4b/test3
logging_steps: 5
save_steps: 100
plot_loss: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1e-5
num_train_epochs: 8.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
resume_from_checkpoint: null
overwrite_output_dir: true
enable_thinking: true
max_grad_norm: 1


val_size: 0.05
eval_strategy: steps
eval_steps: 50
do_eval: true
per_device_eval_batch_size: 1
early_stopping_steps: 5
metric_for_best_model: eval_loss

deepspeed: examples/deepspeed/ds_z2_offload_config.json

teacher_name: Qwen/Qwen3-4B-Instruct-2507  #Qwen/Qwen3-30B-A3B-Instruct-2507 #Qwen/Qwen3-4B-Instruct-2507 
select_type: ce
train_alpha: 1
kl_type: 1 #0


